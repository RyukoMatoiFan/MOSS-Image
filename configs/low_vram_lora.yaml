# Set model and cache_dir before running. Works with caption or edit caches.
# Measure memory with your text length, reference count, batch size and rank.
model: ""
cache_dir: cache/edit
output_dir: runs/low-vram-lora
mode: lora
resolution: 1024
batch: 1
accum: 1
rank: 4
alpha: 4
targets: blocks_and_io
lr: 0.0001
steps: 2000
warmup: 50
optimizer: adamw
weight_decay: 0.01
grad_clip: 1.0
grad_checkpointing: true
mixed_precision: bf16
blocks_to_swap: 42  # Default MOSS architecture; adjust for other layer counts.
block_swap_mode: async  # Frozen H2D-only streaming; adapters stay on CUDA.
base_quantization: int8_convrot
convrot_group_size: 256
cfg_dropout_prob: 0.1
ref_dropout_prob: 0.0
log_every: 10
ckpt_every: 200
