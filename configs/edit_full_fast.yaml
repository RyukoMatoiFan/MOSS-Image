# Opt-in performance preset; see training/PERFORMANCE.md for validation scope.
model: ''
cache_dir: cache/edit
output_dir: runs/edit-full-fast
mode: full
resolution: 1024
cfg_dropout_prob: 0.1
ref_dropout_prob: 0.05
lr: 1.0e-05
steps: 2000
warmup: 100
weight_decay: 0.01
grad_checkpointing: true
ckpt_every: 200
mixed_precision: bf16
attention_backend: flash_attn_2
compile_blocks: false
optimizer: adafactor_fused
full_parameter_dtype: bf16
grad_clip: 0
block_swap_mode: async_full
blocks_to_swap: 0
