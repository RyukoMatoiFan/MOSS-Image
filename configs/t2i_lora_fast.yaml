# Opt-in performance preset; see training/PERFORMANCE.md for validation scope.
model: ''
cache_dir: cache/t2i
output_dir: runs/t2i-lora-fast
mode: lora
resolution: 1024
cfg_dropout_prob: 0.1
ref_dropout_prob: 0.0
rank: 16
alpha: 16
targets: blocks
lr: 0.0001
steps: 1000
warmup: 50
grad_checkpointing: true
ckpt_every: 200
mixed_precision: bf16
attention_backend: flash_attn_2
compile_blocks: false
block_swap_mode: async
blocks_to_swap: 0
