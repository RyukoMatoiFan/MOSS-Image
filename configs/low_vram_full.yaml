# Set model and cache_dir before running. Works with caption or edit caches.
# CPU masters trade transfer bandwidth and host RAM for GPU memory.
# Allow host-memory headroom for checkpoint writing. Tune LR for your dataset;
# native Adafactor scales steps by parameter RMS.
model: ""
cache_dir: cache/edit
output_dir: runs/low-vram-full
mode: full
resolution: 1024
batch: 1
accum: 1
lr: 0.0001
steps: 2000
warmup: 100
optimizer: adafactor
weight_decay: 0.01
grad_clip: 1.0
grad_checkpointing: true
mixed_precision: bf16
blocks_to_swap: 42  # Default MOSS architecture; adjust for other layer counts.
base_quantization: none
checkpoint_format: comfy
cfg_dropout_prob: 0.1
ref_dropout_prob: 0.0
log_every: 10
ckpt_every: 200
